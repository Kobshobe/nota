openapi: 3.1.0
info:
  title: Nota API
  version: 0.4.0
  description: |
    Nota MVP：文字输入 → 摘要、重点、候选待办，并由 Agent 创建、修改、删除事项。

    通用约定：
    - 请求与响应体都是 JSON；请求的 Content-Type 必须是 application/json。
    - 除登录和健康检查外，所有接口要求 Authorization: Bearer <JWT>。
    - 每个响应带 X-Request-Id；错误体带 requestId。
    - 错误响应恒为 {code, message, details?, requestId}；code 只能取 ErrorResponse 枚举里的值。
    - 单次文字输入上限 20,000 字符。
    - 写消息带 clientMessageId；同键重试返回原结果，不重复创建或扣额度。
security:
  - bearerAuth: []
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: health
  - name: auth
  - name: threads
  - name: messages
  - name: items
  - name: usage
paths:
  /api/health:
    get:
      tags: [health]
      operationId: health
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录；新邮箱自动注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/threads:
    get:
      tags: [threads]
      operationId: listThreads
      summary: 列出当前用户的 thread
      responses:
        '200':
          description: 日常 thread 与会议 thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [threads]
      operationId: createThread
      summary: 新建会议 thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: 会议 thread 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/threads/{threadId}:
    get:
      tags: [threads]
      operationId: getThread
      summary: 读取 thread 与消息
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: thread 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/threads/{threadId}/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: 发送一条用户消息，运行 Agent 并返回结果
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Agent 处理完成；同 clientMessageId 重复提交返回原结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/items:
    get:
      tags: [items]
      operationId: listItems
      summary: 列出当前用户的事项
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, done]
        - name: threadId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 事项列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [items]
      operationId: createItem
      summary: 直接创建事项（按钮确认候选待办；不扣额度）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: 已创建的事项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{itemId}:
    patch:
      tags: [items]
      operationId: updateItem
      summary: 修改事项标题或时间
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: 修改后的事项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [items]
      operationId: deleteItem
      summary: 删除事项
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{itemId}/complete:
    post:
      tags: [items]
      operationId: completeItem
      summary: 标记事项完成
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 已完成的事项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/usage:
    get:
      tags: [usage]
      operationId: getUsage
      summary: 查询当日额度
      responses:
        '200':
          description: 当前用户当日额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录、token 失效或登录凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: 当日额度已用完
      headers:
        Retry-After:
          description: 距离额度重置的秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 6
          maxLength: 128
    AuthResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT；客户端存 secure storage
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [email, isVip]
      properties:
        email:
          type: string
          format: email
        isVip:
          type: boolean
    Thread:
      type: object
      additionalProperties: false
      required: [id, kind, title, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [daily, meeting]
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ThreadsResponse:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
    CreateThreadRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [meeting]
        title:
          type: string
          maxLength: 100
    ThreadDetail:
      type: object
      additionalProperties: false
      required: [thread, messages]
      properties:
        thread:
          $ref: '#/components/schemas/Thread'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        payload:
          $ref: '#/components/schemas/MessagePayload'
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        createdAt:
          type: string
          format: date-time
    MessagePayload:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 100
        summary:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/CandidateAction'
        reply:
          type: string
    CandidateAction:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
        owner:
          type: string
        dueAt:
          type: string
          format: date-time
        evidence:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content, clientMessageId]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000
        clientMessageId:
          type: string
          minLength: 8
          maxLength: 64
    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [userMessage, assistantMessage, toolCalls, items, usage]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        assistantMessage:
          $ref: '#/components/schemas/Message'
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        items:
          type: array
          description: 本次消息创建或修改的事项
          items:
            $ref: '#/components/schemas/Item'
        usage:
          $ref: '#/components/schemas/Usage'
    Item:
      type: object
      additionalProperties: false
      required: [id, threadId, kind, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        threadId:
          type: string
        kind:
          type: string
          enum: [reminder, todo]
        title:
          type: string
        dueAt:
          type: string
          format: date-time
        sourceMessageId:
          type: string
        candidateIndex:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [open, done, deleted]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ItemsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [threadId, kind, title]
      properties:
        threadId:
          type: string
        kind:
          type: string
          enum: [reminder, todo]
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueAt:
          type: string
          format: date-time
        sourceMessageId:
          type: string
        candidateIndex:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              kind:
                const: reminder
            required: [kind]
          then:
            required: [dueAt]
        - dependentRequired:
            sourceMessageId: [candidateIndex]
            candidateIndex: [sourceMessageId]
    UpdateItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, name, arguments, result, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
          enum: [create_item, update_item, delete_item, complete_item, search_items, finish]
        arguments:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Usage:
      type: object
      additionalProperties: false
      required: [used, limit, unlimited, date, resetsAt]
      properties:
        used:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        unlimited:
          type: boolean
        date:
          type: string
          format: date
        resetsAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, INVALID_CREDENTIALS, UNAUTHORIZED, NOT_FOUND, QUOTA_EXCEEDED, INTERNAL]
          description: 机器可读的错误码，客户端按码做 UI 决策
        message:
          type: string
          description: 人类可读的诊断说明，不作为 UI 文案
        details:
          type: object
          additionalProperties: true
          description: 结构化错误信息，例如字段错误
        requestId:
          type: string
